<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 60%;
    }
    td {
      padding: 8px;
      border: 1px solid gray;
    }
    h1 {
      text-align: center;
      color: blue;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 5px;
    }
    .button-center {
      text-align: center;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Registration form</h1>
  <form>
    <table>
      <tr>
        <td>First Name</td>
        <td><input type="text" name="firstname" required></td>
      </tr>
      <tr>
        <td>Last Name</td>
        <td><input type="text" name="lastname" required></td>
      </tr>
      <tr>
        <td>Email</td>
        <td><input type="email" name="email" required></td>
      </tr>
      <tr>
        <td>Password</td>
        <td><input type="password" name="password" required></td>
      </tr>
      <tr>
        <td>Re-enter Password</td>
        <td><input type="password" name="repassword" required></td>
      </tr>
      <tr>
        <td>Gender:</td>
        <td>
          <input type="radio" name="gender" value="male"> Male
          <input type="radio" name="gender" value="female"> Female
        </td>
      </tr>
      <tr>
        <td>Age:</td>
        <td><input type="number" name="age"></td>
      </tr>
      <tr>
        <td>Phone Number</td>
        <td><input type="text" name="phone"></td>
      </tr>
      <tr>
        <td>Address</td>
        <td><textarea rows="4" name="address"></textarea></td>
      </tr>
      <tr>
        <td>State</td>
        <td><input type="text" name="state"></td>
      </tr>
      <tr>
        <td>Country</td>
        <td>
          <select name="country">
            <option>Choose your country</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Other</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Languages known</td>
        <td>
          <input type="checkbox" name="lang" value="english"> English
          <input type="checkbox" name="lang" value="kannada"> Kannada
          <input type="checkbox" name="lang" value="hindi"> Hindi
          <input type="checkbox" name="lang" value="telugu"> Telugu
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="checkbox" required> Hereby I declare all the given details are true
        </td>
      </tr>
      <tr>
        <td colspan="2" style="text-align: right;">
          Log in to <a href="https://acharya.ac.in/" target="_blank">Acharya</a> website
        </td>
      </tr>
    </table>
    <div class="button-center">
      <input type="submit" value="Register">
    </div>
  </form>

</body>
</html>
