<!DOCTYPE html>
<html>
<head>
  <title>Nested List and Links</title>
</head>
<body style="background-color: #e6f2f2;"> <!-- light bluish background -->

  <div style="border: 1px solid black; width: fit-content; padding: 10px; margin-bottom: 20px;">
    <p>Lists can be nested (list inside list):</p>
    <ul>
      <li>Coffee</li>
      <li>Tea
        <ul>
          <li>Black tea</li>
          <li>Green tea</li>
        </ul>
      </li>
      <li>Milk</li>
    </ul>
  </div>

  <div style="border: 1px solid black; width: fit-content; padding: 10px;">
    <p>Click any of the following links</p>
    <a href="https://example.com" target="_blank">Opens in New</a> |
    <a href="https://example.com" target="_self">Opens in Self</a> |
    <a href="https://example.com" target="_parent">Opens in Parent</a> |
    <a href="https://example.com" target="_top">Opens in Body</a>
  </div>

</body>
</html>
